<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eceef2;--fg:#23262d;--bd:#b9bdc6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--fg:#e6e8ec;--bd:#444b58}}

html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#stage{position:relative;width:min(100vw,calc((100vh - 70px)*16/9));aspect-ratio:16/9;background:#f6f7f9;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(40,50,70,.16))}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0,#fff 22%,rgba(140,185,255,.92) 75%,rgba(100,140,225,.95))}
#cap{position:absolute;left:0;right:0;bottom:7%;text-align:center;font:600 clamp(14px,2.4vw,34px) system-ui;letter-spacing:.14em;text-transform:uppercase;color:#3a3d44;opacity:0;transition:opacity .4s}
#ui{display:flex;gap:10px;align-items:center;width:min(92vw,900px)}#ui input{flex:1}
button{background:none;color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;cursor:pointer}
